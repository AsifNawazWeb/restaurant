appId: com.restopulse.pos
productName: RestoPulse POS
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
electronLanguages:
  - en
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Office
  desktop:
    Name: RestoPulse POS
    Comment: Offline-first restaurant POS — LKR, offline SQLite
mac:
  target:
    - dmg
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: RestoPulse POS
